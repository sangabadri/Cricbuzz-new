apiVersion: apps/v1
kind: Deployment
metadata:
  name: cricbuzz-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cricbuzz-api
  template:
    metadata:
      labels:
        app: cricbuzz-api
    spec:
      containers:
        - name: api
          image: cricbuzz-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: cricbuzz-config
            - secretRef:
                name: cricbuzz-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15