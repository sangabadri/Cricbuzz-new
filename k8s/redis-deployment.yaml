apiVersion: apps/v1
kind: Deployment
metadata:
  name: cricbuzz-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cricbuzz-redis
  template:
    metadata:
      labels:
        app: cricbuzz-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 2
