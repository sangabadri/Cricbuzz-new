services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cricuser
      POSTGRES_PASSWORD: cricpass
      POSTGRES_DB: cricbuzz
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cricuser -d cricbuzz"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: cricuser
      DB_PASSWORD: cricpass
      DB_NAME: cricbuzz
    ports:
      - "8000:8000"
    volumes:
      - .:/app

volumes:
  pgdata:
